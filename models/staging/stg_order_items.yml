models:

  - name: stg_order_items
    description: Individual items that make up our orders, one row per item.

    columns:
      - name: order_item_id
        description: Item number within an order.
        data_tests:
          - not_null

      - name: order_id
        description: The corresponding order each order item belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
