version: 2

models:
  - name: mart_category_performance
    description: "Product-category performance metrics combining order volume, revenue, and customer review scores to evaluate category performance."
    columns:
      - name: product_category
        description: "Product category name used to group orders, revenue, and customer review performance."

      - name: order_count
        description: "Number of distinct orders containing products from the category."

      - name: revenue
        description: "Total product price revenue generated by the category."

      - name: average_review_score
        description: "Average customer review score for orders associated with the product category, measured on a 1-to-5 scale."
